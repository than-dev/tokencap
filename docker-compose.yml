services:
  tokencap:
    build: .
    container_name: tokencap
    restart: unless-stopped
    ports:
      - "${PORT:-8787}:8787"
    environment:
      - PORT=8787
      - NODE_ENV=production
    volumes:
      - ./tokencap.json:/app/tokencap.json
      - ./tokencap.sqlite:/app/tokencap.sqlite
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8787/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
